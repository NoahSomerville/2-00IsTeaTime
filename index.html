<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        margin: 0;
        padding: 30px;
    }

    .container {
        max-width: 1000px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 2px 10px rgba(0,0,0,.1);
    }

    h1 {
        color: #003366;
        margin-top: 0;
    }

    select {
        width: 100%;
        padding: 12px;
        font-size: 16px;
        margin-bottom: 20px;
    }

    .card {
        display: none;
        border-left: 5px solid #003366;
        background: #fafafa;
        padding: 20px;
        border-radius: 6px;
        white-space: pre-wrap;
        line-height: 1.5;
    }

    .placeholder {
        text-align: center;
        color: #777;
        margin-top: 40px;
    }

    a {
        color: #0066cc;
    }
</style>
</head>
<body>

const select = document.getElementById("companySelect");
const card = document.getElementById("contactCard");
const placeholder = document.getElementById("placeholder");

select.addEventListener("change", function () {

    if (!this.value) {
        card.style.display = "none";
        placeholder.style.display = "block";
        return;
    }

    placeholder.style.display = "none";
    card.style.display = "block";
    card.textContent = data[this.value];
});
